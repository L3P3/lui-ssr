# Run tests with bun
name: Test lui-ssr

on:
  push:
    paths:
      - 'test/**'
      - 'src/**'
  pull_request:
    paths:
      - 'test/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Run tests
        run: bun test
